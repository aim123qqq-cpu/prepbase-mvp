name: Update Telegram skills stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-skills-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse Telegram vacancies
        run: node scripts/parse-telegram-skills.js

      - name: Commit updated stats
        run: |
          if git diff --quiet -- skills-stats.js; then
            echo "No skills stats changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills-stats.js
          git commit -m "Update Telegram skills stats"
          git push
