name: Update hh.ru skills stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/parse-job-sites-skills.js"
      - "scripts/rebuild-company-stats.js"
      - "package.json"
      - ".github/workflows/update-skills-stats.yml"

permissions:
  contents: write

jobs:
  update-skills-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Parse hh.ru analyst vacancies
        run: npm run parse:skills
        env:
          HH_SEARCH_URLS: "https://omsk.hh.ru/search/vacancy?hhtmFrom=main&hhtmFromLabel=vacancy_search_line&search_field=name&search_field=company_name&search_field=description&enable_snippets=true&L_save_area=true&professional_role=10&professional_role=150&professional_role=148"
          HH_USER_AGENT: ${{ vars.HH_USER_AGENT }}
          HH_MAX_SEARCH_PAGES_PER_URL: "50"
          HH_MAX_DETAILS: "2000"
          REQUEST_DELAY_MS: "1000"
          COMPANY_STATS_LIMIT: "500"

      - name: Commit updated stats
        run: |
          if git diff --quiet -- skills-stats.js; then
            echo "No skills stats changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills-stats.js
          git commit -m "Update job site skills stats"
          git push
