name: Update hh.ru skills stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/parse-job-sites-skills.js"
      - ".github/workflows/update-skills-stats.yml"

permissions:
  contents: write

jobs:
  update-skills-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Parse hh.ru analyst vacancies
        run: npm run parse:skills
        env:
          HH_SEARCH_QUERIES: "Системный аналитик|Бизнес-аналитик|Бизнес аналитик"
          HH_AREA: "113"
          HH_USER_AGENT: ${{ vars.HH_USER_AGENT }}
          HH_ACCESS_TOKEN: ${{ secrets.HH_ACCESS_TOKEN }}
          HH_CLIENT_ID: ${{ secrets.HH_CLIENT_ID }}
          HH_CLIENT_SECRET: ${{ secrets.HH_CLIENT_SECRET }}
          COMPANY_STATS_LIMIT: "50"

      - name: Commit updated stats
        run: |
          if git diff --quiet -- skills-stats.js; then
            echo "No skills stats changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills-stats.js
          git commit -m "Update job site skills stats"
          git push
