name: Update job site skills stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/parse-job-sites-skills.js"
      - ".github/workflows/update-skills-stats.yml"

permissions:
  contents: write

jobs:
  update-skills-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Parse job site vacancies
        run: npm run parse:skills
        env:
          SINCE_DATE: "2026-01-01T00:00:00+03:00"

      - name: Commit updated stats
        run: |
          if git diff --quiet -- skills-stats.js; then
            echo "No skills stats changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills-stats.js
          git commit -m "Update job site skills stats"
          git push
