name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/apply-android-branding.mjs"
      - ".github/workflows/android-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Apply AnalystKit branding
        run: node scripts/apply-android-branding.mjs

      - name: Patch generated Android template
        shell: bash
        run: |
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: analystkit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
